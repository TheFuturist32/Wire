[package]
name = "wire-core"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true
description = "Wire protocol library: ephemeral frames and persisted commitment logs"

[dependencies]
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
lz4_flex = "0.14"
rand = "0.10"
sha2 = "0.11"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
